name: 03 - Delegate approved issue to Copilot

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  delegate:
    if: ${{ github.event.label.name == 'develop-with-ai' && !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    env:
      COPILOT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
      PROJECT_OWNER_TYPE: ${{ vars.PROJECT_OWNER_TYPE }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Enforce the human approval gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABELS_JSON: ${{ toJson(github.event.issue.labels.*.name) }}
        shell: bash
        run: |
          if ! jq -e 'index("ready-for-building")' <<<"$LABELS_JSON" >/dev/null; then
            gh issue edit "$ISSUE_NUMBER" --remove-label "develop-with-ai"
            gh issue comment "$ISSUE_NUMBER" --body \
              "Copilot was not started. A maintainer must add \`ready-for-building\` before \`develop-with-ai\`."
            echo "approved=false" >> "$GITHUB_OUTPUT"
          else
            echo "approved=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Synchronize rejected delegation to the Project
        if: ${{ steps.gate.outputs.approved == 'false' && env.PROJECT_TOKEN != '' && env.PROJECT_OWNER != '' && env.PROJECT_NUMBER != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const project = require('./.github/scripts/project-sync.js')
            const { data: issue } = await github.rest.issues.get({
              ...context.repo,
              issue_number: context.payload.issue.number
            })
            await project.syncProject({
              github,
              context,
              core,
              ownerType: process.env.PROJECT_OWNER_TYPE || 'organization',
              projectOwner: process.env.PROJECT_OWNER,
              projectNumber: process.env.PROJECT_NUMBER,
              issue
            })

      - name: Explain missing Copilot token
        if: ${{ steps.gate.outputs.approved == 'true' && env.COPILOT_TOKEN == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body \
            "The issue is approved, but \`COPILOT_AGENT_TOKEN\` is not configured. See \`docs/ATTENDEE-GUIDE.md\`."

      - name: Assign Copilot cloud agent
        if: ${{ steps.gate.outputs.approved == 'true' && env.COPILOT_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABELS_JSON: ${{ toJson(github.event.issue.labels.*.name) }}
        shell: bash
        run: |
          custom_agent=""
          if jq -e 'index("agent:copilot-app")' <<<"$LABELS_JSON" >/dev/null; then
            custom_agent="frontend"
          fi

          jq -n --arg repo "$GITHUB_REPOSITORY" --arg custom_agent "$custom_agent" '{
            assignees: ["copilot-swe-agent[bot]"],
            agent_assignment: {
              target_repo: $repo,
              base_branch: "main",
              custom_instructions: "Follow all repository instructions and skills. Implement the issue, update documentation, add tests, run validation, and open a pull request."
            } + (if $custom_agent == "" then {} else {custom_agent: $custom_agent} end)
          }' | GH_TOKEN="$COPILOT_TOKEN" gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/assignees" \
            --input -

          gh issue comment "$ISSUE_NUMBER" --body \
            "Copilot has accepted the approved issue. Follow progress in the assignee activity and resulting pull request."
