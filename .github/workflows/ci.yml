name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/hotel-booking-web/package-lock.json
      - name: Test API
        run: dotnet test HotelBooking.slnx --configuration Release
      - name: Test issue automation
        run: node --test .github/scripts/issue-automation.test.js
      - name: Build web app
        working-directory: src/hotel-booking-web
        run: |
          npm ci
          npm run lint
          npm run build
